# sdl-kitty tuning: this driver's own choices, keyed by the row ids in
# terminals.toml (the shared facts, https://github.com/visionik/terminal-facts).
#
# Facts go in terminals.toml, not here: what a terminal does is recorded once
# for every program that reads it. This file holds what sdl-kitty chooses
# given those facts: framebuffer caps, coalescing, drain timing, and so on.
#
# Resolving (docs/terminal-profiles.md):
#   seed in C -> [defaults] -> [terminal.<id>] for each terminals.toml row
#   applied, in order (Ghostty 1.3.1: ghostty, then ghostty-1.3), or
#   [terminal.unknown] when no row matches -> facts that decide a setting
#   -> SDL_KITTY_* environment variables.
#
# Facts that decide a setting, and win over the keys here:
#   kitty.frame_edit_reply = false  -> silent_af_ok = true
#   window.ioctl_pixels = false     -> ignore_ioctl_pixels = true
#   kitty.max_escape_bytes          -> apc_chunk_bytes (minus 256 for the header)
#   kitty.shm = false               -> prefer_direct = true
#   kitty.frame_edit = false        -> skip the a=f probe; direct_af_when_shm = false
#   kitty.frame_edit_zlib           -> af_zlib
#
# Compiled into the driver by scripts/update_facts.py; files found at run time
# (SDL_KITTY_PROFILES, the pref and base paths) overlay it.

[defaults]
prefer_direct = false
default_fb_max = "1280x720"
# Transport-aware soft-maxes (0 / omit = fall back to default_fb_max).
default_fb_max_shm = "1280x720"
default_fb_max_direct = "1280x720"
max_direct_bytes = 8294400          # 1920*1080*4
af_max_coverage = 0.40
af_max_pixels = 163840              # 160*1024
# Compress a=f edits (o=z). Used when kitty.frame_edit_zlib is unknown.
af_zlib = false
keys_on_stdin = true
# Used when kitty.frame_edit_reply is unknown: a strict a=f probe needs OK.
silent_af_ok = false
# Used when window.ioctl_pixels is unknown.
ignore_ioctl_pixels = false
direct_af_when_shm = false
direct_fallback_max_bytes = 262144  # 256*1024
# Used when kitty.max_escape_bytes is unknown.
apc_chunk_bytes = 2097152           # 2 MiB
probe_timeout_ms = 40
drain_passes = 8
drain_quiet_us = 15000
stub_winch_iters = 40
stub_winch_delay_ms = 25
stub_cols = 80
stub_rows = 24
key_hold_ms = 80
fb_diff = true
fb_diff_tile = 32
fb_diff_cover = 0.45
tty_pending_max = 4096
window_fallback = "640x480"
place_cells = true
pingpong = false
# Protocol: terminal unlinks after read; the client must not unlink on success.
shm_unlink_after_send = false

[terminal.rex]
# Facts: no t=s (so prefer_direct), silent a=f replies, untrustworthy ioctl pixels.
# Exp 2 Rex soak (2026-10-24): o=z full a=T OK (solid/dirty/alpha); big wire win vs raw.
# a=f stays t=d either way. Full a=T takes zlib; a=f with o=z: kitty.frame_edit_zlib.
prefer_zlib = true
# kitty.storage_bytes = 10 MB; 1080p RGBA is ~8.3 MB, so cap at 720p.
default_fb_max = "1280x720"
default_fb_max_direct = "1280x720"
# Large dirties -> zlib full a=T (was 1.01 = always a=f, ~2.8 MB/frame on MAME soft).
# Watch for a=T flash; kill with SDL_KITTY_AF_MAX_COVERAGE=1.01 if needed.
af_max_coverage = 0.40
af_max_pixels = 2073600             # 1920*1080
direct_af_when_shm = true
# Exp 5 Rex soak: alpha_blit 6->1/2; lower upload_px than gap=0.
coalesce_gap_px = 2
# Keep fb_diff on for MAME soft (tile bbox; no longer expands DIFF_FULL to full FB).
fb_diff = true
notes = "prefer_direct+zlib; FB<=720p (10 MB storage); t=s unsupported"

[terminal.kitty]
default_fb_max = "1920x1080"
# SHM: path-only APC; storage 320 MiB, so soft 1080p.
default_fb_max_shm = "1920x1080"
# Direct: chunked under kitty.max_escape_bytes (256 KiB), so soft 720p.
default_fb_max_direct = "1280x720"
# graphics.c: a=f edits root (r=1) with t=d and marks dirty. Historical
# "SHM a=f blank" was likely client unlink-before-open; keep unlink=false.
# Allow direct sparse a=f on SHM sessions; af_max_* caps base64.
direct_af_when_shm = true
af_max_coverage = 0.40
af_max_pixels = 163840
# Faster quit drain: hot path uses q=2 so few late APC OK replies.
drain_passes = 2
drain_quiet_us = 5000
notes = "Kitty: SHM FB 1080p / direct 720p; APC <=256KiB; af_max_* on multi-rect totals"

[terminal.ghostty]
# Ghostty >= 1.4 / tip, and the base for ghostty-1.3 (which only changes facts:
# no a=f, so no a=f probe and no direct a=f on SHM).
default_fb_max = "1920x1080"
# SHM on; image-storage-limit 320 MB, so soft 1080p.
default_fb_max_shm = "1920x1080"
default_fb_max_direct = "1280x720"
prefer_zlib = false
# Real a=f: allow direct sparse edits while full frames stay SHM.
direct_af_when_shm = true
# Exp 5 soak: merge near dirty rects before multi a=f.
coalesce_gap_px = 2
notes = "Ghostty: SHM 1080p / direct 720p; a=f from 1.4; coalesce=2; APC <=65MiB"

[terminal.wezterm]
# Facts: no working a=f (#8281), so full a=T; no t=s on macOS (#8063).
# Direct everywhere: t=s on Linux hasn't been soaked yet.
prefer_direct = true
# Exp 2 soak: zlib o=z instead of raw base64.
prefer_zlib = true
default_fb_max = "1280x720"
default_fb_max_direct = "1280x720"
drain_passes = 2
drain_quiet_us = 5000
# dirty_at overlays crash WezTerm 20240203; keep multi off.
dirty_at_overlays = false
# Exp 3 killed: overlays cannot erase stale base without a=f (see optimizations.md).
dirty_union_at = false
# Exp 6: skip identical full-scratch uploads (FNV).
upload_skip = true
coalesce_gap_px = 2
af_max_coverage = 0.40
af_max_pixels = 163840
notes = "WezTerm: prefer_zlib; upload_skip; coalesce=2; no SHM; a=f off; dirty_union off"

[terminal.unknown]
# No terminals.toml row matched: a silent a=f probe often means support.
silent_af_ok = true
notes = "Fallback when no terminals.toml row matches"
