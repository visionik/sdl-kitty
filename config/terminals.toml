# sdl-kitty terminal profiles
#
# Defaults & quirks only — runtime probes (a=q / SHM / a=f) still decide what
# is *available*. Env SDL_KITTY_* overrides everything below.
#
# Resolve: copy [defaults] → first matching [[terminal]] overlays set keys only
# → unknown row if nothing matches → env.
#
# Schema: docs/terminal-profiles.md
# Human matrix (generated later): docs/terminals.md
#
# Status: Phase 2 loader active (tomlc17). Search: SDL_KITTY_PROFILES, pref path,
# base path, then in-tree KITTY_DEFAULT_PROFILES_PATH. Missing/bad file → builtins.

[defaults]
prefer_direct = false
default_fb_max = "1280x720"
max_direct_bytes = 8294400          # 1920*1080*4
af_max_coverage = 0.40
af_max_pixels = 163840              # 160*1024
keys_on_stdin = true
silent_af_ok = false
ignore_ioctl_pixels = false
direct_af_when_shm = false
direct_fallback_max_bytes = 262144  # 256*1024
apc_chunk_bytes = 2097152           # 2 MiB
probe_timeout_ms = 40
drain_passes = 8
drain_quiet_us = 15000
stub_winch_iters = 40
stub_winch_delay_ms = 25
stub_cols = 80
stub_rows = 24
key_hold_ms = 80
fb_diff = true
fb_diff_tile = 32
fb_diff_cover = 0.45
tty_pending_max = 4096
window_fallback = "640x480"
place_cells = true
pingpong = false
# Protocol: terminal unlinks after read — client must not unlink on success.
shm_unlink_after_send = false

[[terminal]]
id = "rex"
match.term_program = ["rex"]
prefer_direct = true
# Full-frame a=f OK on Rex (avoids a=T flash). Gate is cov < max, so 1.01 not 1.0.
# Keep fb_diff on for MAME soft; driver must not skip a=f on DIFF_FULL (see framebuffer).
af_max_coverage = 1.01
af_max_pixels = 2073600             # 1920*1080
silent_af_ok = true
ignore_ioctl_pixels = true
direct_af_when_shm = true
notes = "prefer direct; full-frame a=f (no a=T flash); t=s often unsupported medium"

[[terminal]]
id = "kitty"
match.term_program = ["kitty"]
match.term_when_program_empty = ["xterm-kitty"]
match.term_substring = ["kitty"]
match.kitty_window_id = true
default_fb_max = "1920x1080"
prefer_direct = false
# Kitty graphics.c: t=s first-class; a=f edits root (r=1) with t=d and marks dirty.
# Historical "SHM a=f blank" was likely client unlink-before-open; keep unlink=false.
# Allow direct sparse a=f on SHM sessions (same as Ghostty tip); af_max_* caps base64.
silent_af_ok = false
direct_af_when_shm = true
af_max_coverage = 0.40
af_max_pixels = 163840
# vt-parser.c: MAX_ESCAPE_CODE_LENGTH = BUF_SZ/4 = 262144. Longer APCs are ignored
# (base64 spews as text). Payload chunk = that limit minus header/ST headroom.
apc_chunk_bytes = 261888
notes = "Kitty 0.49+: SHM + a=f; prefer SHM; direct_af_when_shm; APC ≤256KiB; af_max_* on multi-rect totals"

# Ghostty 1.3.x stable (≤1.3.1): a=f unimplemented. Put BEFORE the tip catch-all.
[[terminal]]
id = "ghostty-1.3"
match.term_program = ["ghostty"]
match.term_substring = ["ghostty"]
match.term_program_version_max = "1.3.1"
default_fb_max = "1920x1080"
prefer_direct = false
silent_af_ok = false
direct_af_when_shm = false
# apc.zig Protocol.defaultMaxBytes(.kitty) = 65 MiB
apc_chunk_bytes = 68157440
notes = "Ghostty ≤1.3.1: SHM on; a=f unimplemented → dirty_bw off (full a=T); APC ≤65MiB"

# Ghostty tip / 1.3.2-dev+ (animation #13943). First-match: only if version > 1.3.1
# or TERM_PROGRAM_VERSION unset (falls through past ghostty-1.3).
[[terminal]]
id = "ghostty"
match.term_program = ["ghostty"]
match.term_substring = ["ghostty"]
default_fb_max = "1920x1080"
prefer_direct = false
silent_af_ok = false
# Tip has real a=f: allow direct sparse edits while full frames stay SHM.
direct_af_when_shm = true
# apc.zig Protocol.defaultMaxBytes(.kitty) = 65 MiB
apc_chunk_bytes = 68157440
notes = "Ghostty tip/≥1.3.2: SHM + a=f (#13943); direct_af_when_shm; APC ≤65MiB"

[[terminal]]
id = "wezterm"
match.term_program = ["WezTerm", "wezterm"]
match.term_substring = ["wezterm"]
# Cap FB — stuck on full direct a=T (no SHM, no working a=f display).
default_fb_max = "960x540"
# macOS: t=s seek/read → ENXIO until wezterm#8063 (mmap). Prefer direct.
prefer_direct = true
# a=f mutates ImageDataType pixels + inner hash, but ImageData.hash is immutable
# (creation-time only) and is the GPU/dedup key — texture never refreshes.
# silent_af_ok would enable dirty_bw that never paints (bg tint OK, yellow gone).
silent_af_ok = false
direct_af_when_shm = false
# dirty_at overlays crash WezTerm 20240203 (assign_image_to_cells overflow /
# NotNan add in term/src/terminalstate/image.rs). Keep off; opt-in only.
dirty_at_overlays = false
af_max_coverage = 0.40
af_max_pixels = 163840
notes = "WezTerm: prefer direct (macOS SHM #8063); a=f no display invalidate → dirty_bw off; dirty_at crashed host; FB 960x540"

[[terminal]]
id = "unknown"
silent_af_ok = true
notes = "Fallback when TERM_PROGRAM / TERM match nothing"
